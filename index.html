<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>確認</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f5f5f5;
            color: #222;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Noto Sans JP",
                sans-serif;
        }

        .container {
            width: min(90%, 600px);
            text-align: center;
        }

        .question-number {
            color: #777;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .question {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            width: 140px;
            padding: 15px 20px;

            border: 1px solid #ccc;
            border-radius: 8px;

            background: white;
            color: #222;

            font-size: 18px;
            cursor: pointer;

            transition: 0.15s;
        }

        button:hover {
            background: #222;
            color: white;
            transform: translateY(-2px);
        }

        /* 結果画面 */

        .result {
            display: none;
        }

        .result-title {
            font-size: 18px;
            color: #777;
            margin-bottom: 20px;
        }

        .result-text {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .result-image {
            max-width: 100%;
            max-height: 500px;
            border-radius: 10px;
            object-fit: contain;
        }

        @media (max-width: 600px) {
            .question {
                font-size: 23px;
            }

            .result-text {
                font-size: 30px;
            }

            button {
                width: 120px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <!-- 質問画面 -->
        <section id="quiz">

            <div class="question-number" id="questionNumber">
                Q.1
            </div>

            <div class="question" id="question">
                俺はしぐれういですか？
            </div>

            <div class="buttons">
                <button onclick="nextQuestion()">
                    はい
                </button>

                <button onclick="nextQuestion()">
                    いいえ
                </button>
            </div>

        </section>


        <!-- 結果画面 -->
        <section id="result" class="result">

            <div class="result-title">
                結果
            </div>

            <div class="result-text">
                俺はしぐれういだ
            </div>

            <!-- ここに写真を表示 -->
            <img
                id="resultImage"
                class="result-image"
                src="my-photo.jpg"
                alt="俺"
            >

        </section>

    </main>


    <script>

        const questions = [
            "俺はしぐれういですか？",
            "本当に？",
            "本当に？",
            "本当の本当に？",
            "本当ですね？",
            "本当にいいんですね？",
            "後悔しませんね？",
            "もう一度ききますよ？本当ですね？",
            "これは最終確認です。本当ですね？",
            "マジ？"
        ];

        let currentQuestion = 0;


        function nextQuestion() {

            currentQuestion++;

            // Q.10まで終わったら結果画面へ
            if (currentQuestion >= questions.length) {

                document.getElementById("quiz").style.display = "none";
                document.getElementById("result").style.display = "block";

                return;
            }


            // 次の質問を表示
            document.getElementById("questionNumber").textContent =
                "Q." + (currentQuestion + 1);

            document.getElementById("question").textContent =
                questions[currentQuestion];
        }

    </script>

</body>
</html>
