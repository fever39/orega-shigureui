<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>俺がしぐれういだ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- 質問画面 -->
        <section id="question-screen" class="screen">

            <div class="card">

                <p id="question" class="question">
                    Q. 発熱39度がしぐれういであることを承認して下さい
                </p>

                <div class="buttons">

                    <button id="yes-button" class="answer-button yes">
                        はい
                    </button>

                    <button id="no-button" class="answer-button no">
                        いいえ
                    </button>

                </div>

            </div>

        </section>


        <!-- 結果画面 -->
        <section id="result-screen" class="screen hidden">

            <div class="card result-card">

                <p class="result-text">
                    ありがとうございます。<br>
                    発熱39度（@fever_39）がしぐれういである事を承認しました。
                </p>

                <p class="count-text">
                    これまで承認された回数：
                    <span id="approval-count">---</span>回
                </p>

                <img
                    src="my-photo.jpg"
                    alt="発熱39度（@fever_39）の写真"
                    class="result-photo"
                >

                <button id="restart-button" class="restart-button">
                    もう一度
                </button>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
